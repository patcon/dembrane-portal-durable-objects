# Checks, then deploys the Worker, when run by hand (see `on:` below). Needs two repository
# secrets, CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID. The Google secrets
# live on the Worker itself, set once with `wrangler secret put`, and a deploy
# keeps them. See "Deploy it" in the README.
name: Deploy

on:
  # Off for now: run it by hand from the Actions tab. To deploy on each push
  # again, uncomment these two lines.
  # push:
  #   branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run test
      - run: pnpm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
