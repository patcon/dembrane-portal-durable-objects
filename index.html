<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" />
    <title>dembrane portal</title>
    <!-- From echo's index.html: the font and ground, before React mounts, so
         neither flashes. Light only. -->
    <style>
      :root { background: var(--app-background, #f6f4f1); }
    </style>
    <script>
      (() => {
        try {
          const root = document.documentElement;
          root.setAttribute("data-mantine-color-scheme", "light");
          const font = "'DM Sans Variable', sans-serif";
          root.style.setProperty("--app-font-family", font);
          root.style.setProperty("--app-content-bold-font-family", `'DM Sans Content', ${font}`);
          root.setAttribute("data-theme", "parchment");
        } catch {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/client/index.tsx"></script>
  </body>
</html>
